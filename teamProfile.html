<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Team R.M.T.</title>
	<link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="bioglowWebsite.css">
	<link rel="stylesheet" href="https://jsdelivr.net">

</head>

<body>
	<!-- Navbar -->
	<nav class="navbar sticky-top md:navbar-expand bg-1 fg-2">
		<div class="container-fluid">

			<!-- Logo/Brand -->
			<a class="navbar-brand" href="#">
				<img src="Images/Unearthed_logo.png" alt="Logo" width="50" height="40" class="d-inline-block align-text-center">
				Team R.M.T.
			</a>
			<!---------------->

			<!-- Main Content/Drawer -->
			<button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarTopDrawer"
				aria-controls="navbarTopDrawer" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon" aria-hidden="true"></span>
			</button>
			<dialog class="drawer drawer-top" tabindex="-1" id="navbarTopDrawer" aria-labelledby="navbarTopDrawerLabel">
				<div class="drawer-header">
					<h5 class="drawer-title" id="navbarTopDrawerLabel">Navigation</h5>
					<button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
				</div>
				<!-- Drawer Close -->
				<div class="drawer-body">
					<ul class="navbar-nav me-auto mb-2 md:mb-0 mx-auto">
						<li class="nav-item">
							<a class="nav-link" href="teamProfile.html">Team Profile</a>
						</li>
						<li class="nav-item">
							<button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">Robot
								Game</button>
							<div class="menu">
								<a class="menu-item" href="#">Game Plan</a>
								<hr class="menu-divider">
								<a class="menu-item" href="#">Robot Design</a>
								<a class="menu-item" href="#">Programming</a>
							</div>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="#">Innovation Project</a>
						</li>
					</ul>
				</div>
			</dialog>
			<!-- Content Close -->
		</div>
	</nav>

	<br>

	<style>
		.hero-img {
			height: 300px;
			object-position: center;
		}

		@media (min-width: 768px) {
			.hero-img {
				height: auto;
			}
		}
	</style>

	<section class="Opening">
		<div class="card opening-container border-0 rounded-0 w-100 position-relative">
			<img src="Images/Image Carousel/Unearthed_teamphoto.jpg" alt="Overlay Image"
				class="card-img rounded-0 w-100 h-auto hero-img">
			<div class="card-img-overlay d-flex align-items-center bg-white opacity-75 rounded-0 w-100">
				<div class="card-body p-0 w-100">
					<div class="container-fluid p-0 mx-auto" style="width: 80%;">
						<div class="row align-items-center w-100 m-0">
							<div class="col-md-7 p-0 text-start">
								<h1 class="card-text text-dark fw-bold ps-4" style="font-size: clamp(1.75rem, 5.5vw, 4.5rem);">We're
									Team R.M.T.</h1>
								<h5 class="card-text text-dark ps-5" style="font-size: clamp(1rem, 2vw, 1.5rem);">Join us on our
									robotics experience and stay for the ride!</h5>
							</div>
							<div class="col-md-5 d-flex flex-column align-items-start align-items-md-end p-0 mt-4 mt-md-0 gap-3">
								<button type="button"
									class="theme-success btn-subtle btn-md px-4 py-2 py-md-3 text-start text-md-end w-auto"
									style="font-size: clamp(0.8rem, 1.5vw, 1rem); padding: clamp(0.5rem, 1.2vw, 1rem)">
									Check Out Our Innovation Project ->
								</button>
								<button type="button"
									class="theme-danger btn-subtle btn-md px-4 py-2 py-md-3 text-start text-md-end w-auto"
									style="font-size: clamp(0.8rem, 1.5vw, 1rem); padding: clamp(0.5rem, 1.2vw, 1rem)">
									Check Out Our Robot Game & Design ->
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<br>

	<section class="Member-Profiles">
		<div id="carouselProfiles" class="carousel slide carousel-overlay w-25" data-bs-ride="true">
			<div class="carousel-inner rounded-5">

				<div class="carousel-item active">
					<img src="Images/Card Carousel (Mugshots)/oliverMugshot.jpg" class="object-fit-cover d-block w-100 ratio-9x16"
						alt="Oliver Mugshot">
				</div>

				<div class="carousel-item">
					<img src="Images/Card Carousel (Mugshots)/rubyMugshot.jpg" class="object-fit-cover d-block w-100 ratio-9x16" alt="Ruby Mugshot">
				</div>

			</div>
			<div class="carousel-overlay-controls">
				<button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#carouselProfiles" data-bs-slide="prev">
					<span class="carousel-icon-prev" aria-hidden="true"></span>
					<span class="visually-hidden">Previous</span>
				</button>
				<button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#carouselProfiles" data-bs-slide="next">
					<span class="carousel-icon-next" aria-hidden="true"></span>
					<span class="visually-hidden">Next</span>
				</button>
			</div>
		</div>
	</section>

	<script type="module">
  import { Carousel } from './node_modules/bootstrap/dist/js/bootstrap.bundle.min.js';

  new Carousel('#carouselProfiles', {
    autoplay: false
  });
</script>

</body>

</html>
